<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title description">
  <title id="title">Water Reminder</title>
  <desc id="description">A water droplet and the message: one quiet nudge to drink water every two hours, with adjustable intervals and quiet hours.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#183C3D"/>
      <stop offset="1" stop-color="#0D2223"/>
    </linearGradient>
    <radialGradient id="glow" cx="26%" cy="47%" r="57%">
      <stop offset="0" stop-color="#00BCC8" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#00BCC8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="water" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#E1FFFF"/>
      <stop offset="0.42" stop-color="#67E3E9"/>
      <stop offset="1" stop-color="#00A9B5"/>
    </linearGradient>
    <filter id="soft-shadow" x="-45%" y="-35%" width="190%" height="190%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#001011" flood-opacity="0.55"/>
    </filter>
    <pattern id="stitch" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.7" fill="#F0E3CC" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1000" height="620" rx="34" fill="#0A1718"/>
  <rect x="18" y="18" width="964" height="584" rx="28" fill="url(#panel)" stroke="#57E7F1" stroke-opacity="0.36" stroke-width="2"/>
  <rect x="19" y="19" width="962" height="582" rx="27" fill="url(#stitch)"/>
  <rect x="20" y="20" width="960" height="580" rx="26" fill="url(#glow)"/>

  <circle cx="275" cy="310" r="190" fill="#00BCC8" fill-opacity="0.055"/>
  <circle cx="275" cy="310" r="164" fill="none" stroke="#79EEF2" stroke-opacity="0.16" stroke-width="2"/>
  <circle cx="275" cy="310" r="143" fill="none" stroke="#D0FF00" stroke-opacity="0.34" stroke-width="2" stroke-dasharray="4 13" stroke-linecap="round"/>
  <path d="M275 181c-3 0-89 106-89 170a89 89 0 0 0 178 0c0-64-86-170-89-170Z" fill="url(#water)" filter="url(#soft-shadow)"/>
  <path d="M236 321c4-23 22-51 38-70" fill="none" stroke="#FFFFFF" stroke-opacity="0.78" stroke-width="8" stroke-linecap="round"/>
  <circle cx="275" cy="135" r="5" fill="#D0FF00"/>
  <circle cx="451" cy="310" r="5" fill="#57E7F1"/>
  <circle cx="99" cy="310" r="5" fill="#57E7F1"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="520" y="190" fill="#70E8EE" font-size="19" font-weight="700" letter-spacing="4">WATER REMINDER</text>
    <text x="520" y="270" fill="#F7F2E8" font-size="48" font-weight="400">One quiet nudge</text>
    <text x="520" y="326" fill="#F7F2E8" font-size="48" font-weight="400">to drink water.</text>
    <path d="M520 365h370" stroke="#F0E3CC" stroke-opacity="0.24" stroke-width="1"/>
    <circle cx="531" cy="420" r="6" fill="#D0FF00"/>
    <text x="550" y="428" fill="#D0FF00" font-size="24" font-weight="700" letter-spacing="1">EVERY TWO HOURS</text>
    <text x="520" y="477" fill="#D8C2A0" font-size="18">Adjust the interval · quiet hours · no intake log</text>
  </g>
</svg>
