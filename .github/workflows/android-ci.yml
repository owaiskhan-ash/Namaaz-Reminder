name: Android CI

on:
  push:
    branches:
      - main
      - 'arena/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # The upload key below is derived from the committed, publicly-known Android
  # debug key (see app/build.gradle.kts -> signingConfigs.debugConfig), so the
  # password is not a secret. It only exists to satisfy the `release`
  # signingConfig, which expects the `upload` key alias.
  APK_STORE_PASSWORD: namaaz-apk-build
  APK_KEY_PASSWORD: namaaz-apk-build

jobs:
  build:
    name: Test & build APKs
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Bundle Madinah Azaan into APK raw resources
        # Bundling Madinah Azaan directly into res/raw/madinah_azaan.mp3 ensures
        # the full Madinah Azaan plays immediately offline (and in Silent/Vibrate
        # mode via STREAM_ALARM) without waiting for a post-install download.
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/raw
          if [ ! -s app/src/main/res/raw/madinah_azaan.mp3 ]; then
            curl -fsSL --retry 3 --retry-delay 2 \
              "https://oxtqzqynhtybrgushmjp.supabase.co/storage/v1/object/public/Just%20Apps/Namaaz%20reminder/Madinah%20Azaan.mp3" \
              -o app/src/main/res/raw/madinah_azaan.mp3
          fi
          ls -lh app/src/main/res/raw/madinah_azaan.mp3

      - name: Run unit tests
        # The output is kept in a file, so a compile error can be published on
        # the release page together with the test summary.
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee gradle-test.log

      - name: Summarise the unit test run
        # The summary is published on the `apk-latest` release page and on the
        # `apk-builds` branch, so the outcome of a run can be read without
        # digging through the Actions log.
        # This step must never fail the build: the greps below legitimately
        # find nothing when the tests pass, and the default shell runs with
        # `errexit`, so every grep is guarded with `|| true`.
        if: always()
        run: |
          set -uo pipefail
          REPORT_DIR="app/build/test-results/testDebugUnitTest"
          {
            echo "- commit: \`${GITHUB_SHA::8}\`"
            echo "- branch: \`${GITHUB_REF_NAME}\`"
            echo
            if compgen -G "$REPORT_DIR/TEST-*.xml" > /dev/null; then
              echo "## Test classes"
              echo
              for xml in "$REPORT_DIR"/TEST-*.xml; do
                [ -e "$xml" ] || continue
                echo "- \`$(basename "$xml")\` $(grep -o 'tests="[0-9]*"[^>]*' "$xml" | head -1 || true)"
              done
              echo
              echo "## Failures"
              echo
              echo '```'
              for xml in "$REPORT_DIR"/TEST-*.xml; do
                [ -e "$xml" ] || continue
                if grep -q "<failure\|<error" "$xml"; then
                  echo "### $(basename "$xml")"
                  sed -e 's/&quot;/"/g' -e 's/&lt;/</g' -e 's/&gt;/>/g' -e 's/&amp;/\&/g' "$xml" \
                    | sed -n '/<testcase/,/<\/testcase>/p' \
                    | head -60
                  echo
                fi
              done
              echo '```'
            else
              echo "No test report was produced."
            fi
            if [ -f gradle-test.log ]; then
              echo
              echo "## Build errors"
              echo
              echo '```'
              grep -E "^e: |error: |FAILURE:|What went wrong|> Task .* FAILED|Unresolved reference|Cannot access|None of the following" gradle-test.log | head -40 || true
              echo '```'
            fi
          } > test-summary.md
          cat test-summary.md

      - name: Upload the unit test summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-summary
          path: test-summary.md
          if-no-files-found: warn

      - name: Detect the upload key
        # The Play upload key lives in repository secrets. Without it the build
        # still works (APKs signed with the debug key), but no .aab is produced:
        # publishing a bundle signed by a throwaway key would lock the listing
        # onto that key.
        run: |
          set -euo pipefail
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "HAS_UPLOAD_KEY=1" >> "$GITHUB_ENV"
            echo "Using the upload key from repository secrets."
          else
            echo "HAS_UPLOAD_KEY=0" >> "$GITHUB_ENV"
            echo "::warning::No KEYSTORE_BASE64 secret; release APKs will be signed with the debug key and no .aab will be built."
          fi

      - name: Prepare release signing key
        # The `release` build type signs with key alias `upload`.
        #   * With the upload-key secret: decode the real Play upload key, so the
        #     .aab uploads to Play and every future build carries the same
        #     signature.
        #   * Without it: import the committed debug key under the `upload`
        #     alias, which keeps the side-loadable APKs installable and
        #     upgradeable in place.
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/my-upload-key.jks"
          if [ "$HAS_UPLOAD_KEY" = "1" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KS"
            chmod 600 "$KS"
            echo "STORE_PW=$SECRET_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_PW=$SECRET_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Decoded the upload key from repository secrets."
          else
            if keytool -importkeystore \
                  -srckeystore debug.keystore -srcstoretype PKCS12 -srcstorepass android \
                  -srcalias androiddebugkey -srckeypass android \
                  -destkeystore "$KS" -deststoretype PKCS12 \
                  -deststorepass "$APK_STORE_PASSWORD" -destkeypass "$APK_KEY_PASSWORD" \
                  -destalias upload; then
              echo "Imported the committed debug key under the 'upload' alias."
            else
              echo "Falling back to generating a fresh upload key."
              keytool -genkeypair -v -keystore "$KS" -storetype PKCS12 \
                -storepass "$APK_STORE_PASSWORD" -keypass "$APK_KEY_PASSWORD" \
                -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Namaaz Reminder, OU=Mobile, O=Namaaz, L=Mumbai, ST=Maharashtra, C=IN"
            fi
            echo "STORE_PW=$APK_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_PW=$APK_KEY_PASSWORD" >> "$GITHUB_ENV"
          fi
          keytool -list -v -keystore "$KS" -storepass "$(grep '^STORE_PW=' "$GITHUB_ENV" | cut -d= -f2-)" \
            -alias upload | grep -E "Alias|Valid from|SHA256" || true

      - name: Build debug and release APKs, and the Play bundle
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/my-upload-key.jks
          STORE_PASSWORD: ${{ env.STORE_PW }}
          KEY_PASSWORD: ${{ env.KEY_PW }}
        # The .aab is what Google Play accepts; the APKs stay for side-loading.
        # The bundle is only built when the real upload key is available.
        run: |
          set -euo pipefail
          TASKS="assembleDebug assembleRelease"
          if [ "$HAS_UPLOAD_KEY" = "1" ]; then TASKS="$TASKS bundleRelease"; fi
          ./gradlew $TASKS --stacktrace

      - name: Collect APKs
        run: |
          set -euo pipefail
          VERSION="$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/NamaazReminder-${VERSION}-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/NamaazReminder-${VERSION}-release.apk"
          if [ "$HAS_UPLOAD_KEY" = "1" ]; then
            cp app/build/outputs/bundle/release/app-release.aab "dist/NamaazReminder-${VERSION}-release.aab"
          else
            echo "Skipping the .aab: signed with the debug key, not the upload key."
          fi
          ls -lh dist

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: NamaazReminder-apks
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish APKs for download
    # Only run for pushes (never for pull requests, where the token is read-only).
    # It also runs when the build failed, so the release page can report why.
    if: always() && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # `gh` resolves the target repository from the local git checkout, so the
      # repository has to be checked out before any `gh release` call.
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download built APKs
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: NamaazReminder-apks
          path: apk

      - name: Download the unit test summary
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: test-summary
          path: summary

      - name: Publish to the rolling `apk-latest` release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          SHA="${GITHUB_SHA::8}"
          HAS_APK=0
          ls apk/*.apk >/dev/null 2>&1 && HAS_APK=1
          {
            echo "Namaaz Reminder APKs."
            echo
            echo "* \`-debug.apk\`: debug build, signed with the standard Android debug key."
            echo "* \`-release.apk\`: release build (minification off), signed with the same"
            echo "  certificate so it can upgrade the debug build in place."
            if ls apk/*.aab >/dev/null 2>&1; then
              echo "* \`-release.aab\`: Play bundle, signed with the upload key."
            fi
            echo
            echo "Install with: \`adb install -r <file>.apk\`"
            echo
            if [ "$HAS_APK" = "1" ]; then
              echo "## Latest build"
            else
              echo "## Latest run"
              echo
              echo "> This run did not produce new APKs, the files of this release are from the last successful build."
            fi
            echo
            if [ -f summary/test-summary.md ]; then
              cat summary/test-summary.md
            else
              echo "No unit test report was produced for this run."
            fi
          } > notes.md

          mapfile -t FILES < <(ls apk/*.apk apk/*.aab 2>/dev/null || true)
          if [ "${#FILES[@]}" -gt 0 ]; then
            if gh release view apk-latest --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              gh release upload apk-latest "${FILES[@]}" --clobber --repo "${GITHUB_REPOSITORY}"
            else
              gh release create apk-latest "${FILES[@]}" \
                --repo "${GITHUB_REPOSITORY}" \
                --title "Namaaz Reminder (latest APK build)" \
                --notes-file notes.md \
                --target "$GITHUB_SHA"
            fi
          fi
          # The notes are published in any case, so a failed run can be read
          # from the release page without digging through the Actions log.
          if gh release view apk-latest --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit apk-latest --notes-file notes.md --repo "${GITHUB_REPOSITORY}"
          fi

      - name: Mirror APKs to the `apk-builds` branch
        # Keeps a fetchable copy of the APKs inside the repository itself so
        # they can be downloaded straight from the branch page. The push uses
        # the credentials persisted by actions/checkout, so no token has to be
        # exported into the environment.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          cd "$GITHUB_WORKSPACE"
          mkdir -p apk-build
          for f in apk/*.apk apk/*.aab; do
            [ -e "$f" ] && cp "$f" apk-build/
          done
          # Do not leave a stale bundle behind: a .aab from an earlier run would
          # be signed with a different key than the one Play now expects.
          if ! ls apk/*.aab >/dev/null 2>&1; then
            rm -f apk-build/*.aab
          fi
          if [ -f summary/test-summary.md ]; then
            cp summary/test-summary.md apk-build/test-summary.md
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f apk-build
          if git diff --cached --quiet -- apk-build; then
            echo "Nothing changed since the last mirror."
            exit 0
          fi
          git commit -q -m "chore: APK build ${GITHUB_SHA::8}"
          git push --force origin HEAD:refs/heads/apk-builds
          git ls-remote --heads origin apk-builds

  release:
    name: Publish APK to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built APKs
        uses: actions/download-artifact@v4
        with:
          name: NamaazReminder-apks
          path: apk

      - name: Attach APK to release
        uses: softprops/action-gh-release@v2
        with:
          files: apk/*.apk
