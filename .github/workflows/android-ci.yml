name: Android CI

on:
  push:
    branches:
      - main
      - 'arena/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # The upload key below is derived from the committed, publicly-known Android
  # debug key (see app/build.gradle.kts -> signingConfigs.debugConfig), so the
  # password is not a secret. It only exists to satisfy the `release`
  # signingConfig, which expects the `upload` key alias.
  APK_STORE_PASSWORD: namaaz-apk-build
  APK_KEY_PASSWORD: namaaz-apk-build

jobs:
  build:
    name: Test & build APKs
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Summarise the unit test run
        # The summary is published on the `apk-latest` release page and on the
        # `apk-builds` branch, so the outcome of a run can be read without
        # digging through the Actions log.
        if: always()
        run: |
          set -uo pipefail
          REPORT_DIR="app/build/test-results/testDebugUnitTest"
          {
            echo "- commit: \`${GITHUB_SHA::8}\`"
            echo "- branch: \`${GITHUB_REF_NAME}\`"
            echo
            if compgen -G "$REPORT_DIR/TEST-*.xml" > /dev/null; then
              echo "## Test classes"
              echo
              for xml in "$REPORT_DIR"/TEST-*.xml; do
                [ -e "$xml" ] || continue
                echo "- \`$(basename "$xml")\` $(grep -o 'tests="[0-9]*"[^>]*' "$xml" | head -1)"
              done
              echo
              echo "## Failures"
              echo
              echo '```'
              for xml in "$REPORT_DIR"/TEST-*.xml; do
                [ -e "$xml" ] || continue
                if grep -q "<failure\|<error" "$xml"; then
                  echo "### $(basename "$xml")"
                  sed -e 's/&quot;/"/g' -e 's/&lt;/</g' -e 's/&gt;/>/g' -e 's/&amp;/\&/g' "$xml" \
                    | sed -n '/<testcase/,/<\/testcase>/p' \
                    | head -60
                  echo
                fi
              done
              echo '```'
            else
              echo "No test report was produced."
            fi
          } > test-summary.md
          cat test-summary.md

      - name: Upload the unit test summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-summary
          path: test-summary.md
          if-no-files-found: warn

      - name: Prepare release signing key
        # The `release` build type signs with key alias `upload`. We import the
        # committed debug key under that alias so that:
        #   * the release APK is installable (signed with a known certificate),
        #   * the signature is stable across builds, so a newer APK can upgrade
        #     an older one instead of asking the user to uninstall first.
        # If the import ever fails we fall back to a freshly generated key.
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/my-upload-key.jks"
          if keytool -importkeystore \
                -srckeystore debug.keystore -srcstoretype PKCS12 -srcstorepass android \
                -srcalias androiddebugkey -srckeypass android \
                -destkeystore "$KS" -deststoretype PKCS12 \
                -deststorepass "$APK_STORE_PASSWORD" -destkeypass "$APK_KEY_PASSWORD" \
                -destalias upload; then
            echo "Imported the committed debug key under the 'upload' alias."
          else
            echo "Falling back to generating a fresh upload key."
            keytool -genkeypair -v -keystore "$KS" -storetype PKCS12 \
              -storepass "$APK_STORE_PASSWORD" -keypass "$APK_KEY_PASSWORD" \
              -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Namaaz Reminder, OU=Mobile, O=Namaaz, L=Mumbai, ST=Maharashtra, C=IN"
          fi
          keytool -list -keystore "$KS" -storepass "$APK_STORE_PASSWORD" -alias upload

      - name: Build debug and release APKs
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/my-upload-key.jks
          STORE_PASSWORD: ${{ env.APK_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ env.APK_KEY_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Collect APKs
        run: |
          set -euo pipefail
          VERSION="$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/NamaazReminder-${VERSION}-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/NamaazReminder-${VERSION}-release.apk"
          ls -lh dist

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: NamaazReminder-apks
          path: dist/*.apk
          if-no-files-found: error

  publish:
    name: Publish APKs for download
    # Only run for pushes (never for pull requests, where the token is read-only).
    # It also runs when the build failed, so the release page can report why.
    if: always() && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # `gh` resolves the target repository from the local git checkout, so the
      # repository has to be checked out before any `gh release` call.
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download built APKs
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: NamaazReminder-apks
          path: apk

      - name: Download the unit test summary
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: test-summary
          path: summary

      - name: Publish to the rolling `apk-latest` release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          SHA="${GITHUB_SHA::8}"
          {
            echo "Namaaz Reminder APKs, built from commit \`$SHA\`."
            echo
            echo "* \`-debug.apk\` — debug build, signed with the standard Android debug key."
            echo "* \`-release.apk\` — release build (minification off), signed with the same"
            echo "  certificate so it can upgrade the debug build in place."
            echo
            echo "Install with: \`adb install -r <file>.apk\`"
            echo
            echo "## Latest build"
            echo
            if [ -f summary/test-summary.md ]; then
              cat summary/test-summary.md
            else
              echo "No unit test report was produced for this run."
            fi
          } > notes.md

          if ls apk/*.apk >/dev/null 2>&1; then
            if gh release view apk-latest --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              gh release upload apk-latest apk/*.apk --clobber --repo "${GITHUB_REPOSITORY}"
            else
              gh release create apk-latest apk/*.apk \
                --repo "${GITHUB_REPOSITORY}" \
                --title "Namaaz Reminder (latest APK build)" \
                --notes-file notes.md \
                --target "$GITHUB_SHA"
            fi
            gh release edit apk-latest --notes-file notes.md --repo "${GITHUB_REPOSITORY}"
          else
            echo "This run produced no APK; the published release was left untouched."
          fi

      - name: Mirror APKs to the `apk-builds` branch
        # Keeps a fetchable copy of the APKs inside the repository itself so
        # they can be downloaded straight from the branch page. The push uses
        # the credentials persisted by actions/checkout, so no token has to be
        # exported into the environment.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          cd "$GITHUB_WORKSPACE"
          if ! ls apk/*.apk >/dev/null 2>&1; then
            echo "This run produced no APK; nothing to mirror."
            exit 0
          fi
          mkdir -p apk-build
          cp apk/*.apk apk-build/
          if [ -f summary/test-summary.md ]; then
            cp summary/test-summary.md apk-build/test-summary.md
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f apk-build
          git commit -q -m "chore: APK build ${GITHUB_SHA::8}"
          git push --force origin HEAD:refs/heads/apk-builds
          git ls-remote --heads origin apk-builds

  release:
    name: Publish APK to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built APKs
        uses: actions/download-artifact@v4
        with:
          name: NamaazReminder-apks
          path: apk

      - name: Attach APK to release
        uses: softprops/action-gh-release@v2
        with:
          files: apk/*.apk
