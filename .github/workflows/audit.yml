name: Audit

# Pre-publish audit: runs the Android linter and the unit tests. The reports
# are uploaded as workflow artifacts (never committed), so the branch history
# stays free of generated files.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint + tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run lint
        # --continue so the report is produced even when lint finds errors.
        run: ./gradlew lintDebug --continue

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --continue

      - name: Upload the lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-debug.txt
            app/build/reports/lint-results-debug.html
          if-no-files-found: warn

      - name: Upload the unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: warn

      - name: Summarise the result
        if: always()
        run: |
          set -uo pipefail
          {
            echo "## Android Lint"
            echo
            if [ -f app/build/reports/lint-results-debug.txt ]; then
              sed -n '1,40p' app/build/reports/lint-results-debug.txt
            else
              echo "No lint report was produced."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
