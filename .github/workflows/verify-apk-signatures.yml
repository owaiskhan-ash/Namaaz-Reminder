name: Verify APK signatures

on:
  push:
    branches:
      - 'arena/**'
    paths:
      - '.github/workflows/verify-apk-signatures.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Compare the signing certificates of the published APKs
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download the published APKs
        run: |
          set -euo pipefail
          mkdir -p apks
          cd apks
          for name in NamaazReminder-1.0-debug.apk NamaazReminder-1.0-release.apk \
                      NamaazReminder-1.1-debug.apk NamaazReminder-1.1-release.apk; do
            curl -sSL -o "$name" \
              "https://github.com/owaiskhan-ash/Namaaz-Reminder/releases/download/apk-latest/$name"
          done
          ls -lh

      - name: Print the certificate of every APK
        run: |
          set -uo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$(ls -1 "$SDK"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)"
          if [ -z "$APKSIGNER" ]; then
            APKSIGNER="$(command -v apksigner || true)"
          fi
          echo "Using apksigner: ${APKSIGNER:-<not found>}"
          {
            echo "# APK signature report"
            echo
            echo "apksigner: ${APKSIGNER:-<not found>}"
            echo
            for apk in apks/*.apk; do
              echo "## $(basename "$apk")"
              echo
              echo '```'
              if [ -n "${APKSIGNER:-}" ]; then
                "$APKSIGNER" verify --print-certs "$apk" 2>&1 || echo "(apksigner exited non-zero)"
              else
                echo "(apksigner not available)"
              fi
              echo '```'
              echo
              echo "sha256 of the APK file: $(sha256sum "$apk" | cut -d' ' -f1)"
              echo
            done
          } > signature-report.md
          cat signature-report.md

      - name: Publish the report to the `apk-signature-check` branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f apks/*.apk
          git add -f signature-report.md
          git commit -q -m "docs: APK signature report"
          git push --force origin HEAD:refs/heads/apk-signature-check
