name: Play bundle

# Builds the signed Android App Bundle (.aab) that Google Play accepts and
# publishes it on the `play-bundle` release, together with the upload key when
# this repository has no key configured yet.
#
# Run it from Actions -> "Play bundle" -> Run workflow, on the branch or tag you
# want to publish. Nothing is uploaded to Play automatically.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release to attach the bundle to"
        required: false
        default: "play-bundle"
  # Pushing a tag that starts with "play-" builds a bundle for that commit. This
  # is the trigger to use when the workflow token cannot dispatch workflows.
  push:
    tags:
      - "play-*"

permissions:
  contents: write

env:
  # Password used for a freshly generated upload key. Public on purpose: the
  # repository has no KEYSTORE_BASE64 secret, and whoever publishes this app
  # still needs Play Console access to upload anything.
  FALLBACK_STORE_PASSWORD: namaaz-apk-build

jobs:
  bundle:
    name: Build the .aab
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Bundle the Madinah Azaan audio
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/bundle-azaan.sh

      - name: Prepare the upload key
        id: uploadkey
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/my-upload-key.jks"
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KS"
            chmod 600 "$KS"
            STORE_PW="$SECRET_STORE_PASSWORD"
            KEY_PW="$SECRET_KEY_PASSWORD"
            echo "GENERATED=0" >> "$GITHUB_ENV"
            echo "KEY_SOURCE=the repository secrets" >> "$GITHUB_ENV"
            echo "Using the upload key from repository secrets."
          elif gh release download play-bundle --pattern 'namaaz-upload-key.jks' \
                 --dir "$RUNNER_TEMP/key" --clobber --repo "$GITHUB_REPOSITORY"; then
            # Reuse the key published by the first run. Generating a new one on
            # every build would make every AAB unuploadable: Play keeps the key
            # of the first successful upload.
            cp "$RUNNER_TEMP/key/namaaz-upload-key.jks" "$KS"
            chmod 600 "$KS"
            STORE_PW="$FALLBACK_STORE_PASSWORD"
            KEY_PW="$FALLBACK_STORE_PASSWORD"
            echo "GENERATED=0" >> "$GITHUB_ENV"
            echo "KEY_SOURCE=the key published on the play-bundle release" >> "$GITHUB_ENV"
            echo "Reusing the upload key published on the play-bundle release."
          else
            keytool -genkeypair -v -keystore "$KS" -storetype PKCS12 \
              -storepass "$FALLBACK_STORE_PASSWORD" -keypass "$FALLBACK_STORE_PASSWORD" \
              -alias upload -keyalg RSA -keysize 4096 -validity 10000 \
              -dname "CN=Namaaz Reminder, OU=Mobile, O=Namaaz, L=Mumbai, ST=Maharashtra, C=IN"
            STORE_PW="$FALLBACK_STORE_PASSWORD"
            KEY_PW="$FALLBACK_STORE_PASSWORD"
            echo "GENERATED=1" >> "$GITHUB_ENV"
            echo "KEY_SOURCE=a key generated by this run" >> "$GITHUB_ENV"
            echo "::warning::No KEYSTORE_BASE64 secret and no published key: generated a new upload key."
          fi
          echo "KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
          echo "STORE_PW=$STORE_PW" >> "$GITHUB_ENV"
          echo "KEY_PW=$KEY_PW" >> "$GITHUB_ENV"
          keytool -list -v -keystore "$KS" -storepass "$STORE_PW" -alias upload \
            | grep -E "Alias|Valid from|SHA256" || true
          # The fingerprint Play Console shows must match this one, otherwise the
          # upload is rejected with "signed with the wrong key".
          FP="$(keytool -list -v -keystore "$KS" -storepass "$STORE_PW" -alias upload \
                | awk '/SHA256:/{print $2; exit}')"
          echo "UPLOAD_KEY_SHA256=$FP" >> "$GITHUB_ENV"
          echo "Upload key SHA-256: $FP"

      - name: Build the Play bundle
        env:
          STORE_PASSWORD: ${{ env.STORE_PW }}
          KEY_PASSWORD: ${{ env.KEY_PW }}
        run: ./gradlew bundleRelease --stacktrace

      - name: Verify the bundle
        run: |
          set -euo pipefail
          AAB="app/build/outputs/bundle/release/app-release.aab"
          ls -lh "$AAB"
          echo "--- signature ---"
          keytool -printcert -jarfile "$AAB" | grep -E "Owner|Issuer|SHA256" || true
          jarsigner -verify "$AAB" | tail -2 || true
          echo "--- contents ---"
          unzip -l "$AAB" | grep -E "madinah_azaan|AndroidManifest|BUNDLE-METADATA" | head -5
          # The azaan must be inside, otherwise reminders would be silent on a
          # fresh install.
          unzip -l "$AAB" | grep -q "res/raw/madinah_azaan" \
            || echo "::warning::The bundle does not contain madinah_azaan.mp3."
          VERSION="$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')"
          BUNDLE_CODE="$(grep -m1 'versionCode' app/build.gradle.kts | grep -oE '[0-9]+')"
          mkdir -p dist
          cp "$AAB" "dist/NamaazReminder-${VERSION}-release.aab"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUNDLE_CODE=$BUNDLE_CODE" >> "$GITHUB_ENV"
          echo "versionName $VERSION / versionCode $BUNDLE_CODE"

      - name: Collect the generated upload key
        if: env.GENERATED == '1'
        run: |
          set -euo pipefail
          cp "$KEYSTORE_PATH" dist/namaaz-upload-key.jks
          echo "Included the newly generated upload key in the release."

      - name: Publish the bundle
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || 'play-bundle' }}
        run: |
          set -uo pipefail
          cd dist
          sha256sum ./* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..
          {
            echo "Signed Android App Bundle for Namaaz Reminder ${VERSION} (versionCode ${BUNDLE_CODE})."
            echo
            echo "Upload \`NamaazReminder-${VERSION}-release.aab\` to the Play Console (Test and release -> Production -> Create new release)."
            echo
            echo "**Upload key SHA-256:** \`${UPLOAD_KEY_SHA256}\`"
            echo
            echo "Play only accepts a bundle signed with the upload key registered for this app. Compare this fingerprint with *Play Console -> Test and release -> App signing -> Upload key*; if they differ, either add the registered key as the \`KEYSTORE_BASE64\` secret or request an upload key reset and then upload this bundle."
            echo
            if [ "${GENERATED}" = "1" ]; then
              echo "### Upload key"
              echo
              echo "This repository has no \`KEYSTORE_BASE64\` secret, so this run generated a new upload key and attached it:"
              echo
              echo "* \`namaaz-upload-key.jks\` - PKCS12, alias \`upload\`, RSA 4096, valid for 10000 days"
              echo "* store password and key password: \`namaaz-apk-build\`"
              echo
              echo "Keep that file: every future AAB for this app has to be signed with it, otherwise Play rejects the upload."
              echo "To let CI sign future builds with it, add it as the \`KEYSTORE_BASE64\`, \`STORE_PASSWORD\` and \`KEY_PASSWORD\` secrets:"
              echo
              echo '```bash'
              echo "base64 -w0 namaaz-upload-key.jks    # -> KEYSTORE_BASE64"
              echo "# STORE_PASSWORD = KEY_PASSWORD = namaaz-apk-build"
              echo '```'
              echo
              echo "Because this key is published here, anyone can sign a build with it. That does not let them publish (that needs your Play Console login), and Play lets you reset an upload key with *App integrity -> Upload key certificate -> Request upload key reset* if you would rather start with a private one."
            else
              echo "Signed with the upload key from ${KEY_SOURCE}."
            fi
            echo
            echo "### Checksums"
            echo
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } > notes.md

          mapfile -t FILES < <(ls dist/*.aab dist/*.jks 2>/dev/null || true)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "${FILES[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Namaaz Reminder Play bundle" \
              --notes-file notes.md \
              --target "$GITHUB_SHA"
          fi
          gh release edit "$TAG" --notes-file notes.md --repo "$GITHUB_REPOSITORY"
          gh release view "$TAG" --json url -q .url --repo "$GITHUB_REPOSITORY" || true
