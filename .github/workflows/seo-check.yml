name: SEO check

# Guards the static site in docs/ against the regressions the SEO audit found:
# canonical host drift, indexability directives, sitemap freshness, title and
# description errors, FAQ/schema mismatches, dead internal links and broken
# entity graphs. Runs whenever the site or its generator changes.
on:
  push:
    branches:
      - main
      - 'arena/**'
    paths:
      - 'docs/**'
      - 'design/build_app_pages.py'
      - 'design/build_app_og_cards.py'
      - 'design/seo_check.py'
      - 'design/test_seo_check.py'
      - '.github/workflows/seo-check.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'design/build_app_pages.py'
      - 'design/build_app_og_cards.py'
      - 'design/seo_check.py'
      - 'design/test_seo_check.py'
      - '.github/workflows/seo-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seo:
    name: Pages, schema & indexability
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Test indexing and sitemap guards
        run: python3 -m unittest discover -s design -p 'test_*.py'

      - name: Run SEO/AISO checks
        run: python3 design/seo_check.py
